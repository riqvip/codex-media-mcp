name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --dev --python 3.13
      - name: Check Python formatting and lint
        run: |
          uv run --frozen ruff format --check src tests scripts
          uv run --frozen ruff check src tests scripts
      - name: Build source and wheel packages
        run: uv build
      - name: Validate Compose example
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Test with real FFmpeg and mocked OpenRouter
        run: docker build --target test -t codex-media-mcp-test .
